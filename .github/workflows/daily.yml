name: Glermenrik Creative Den Engine

on:
  # Manual catch-up trigger: refresh the edition when a scheduled run is missed.
  workflow_dispatch:
  push:
    paths:
      - 'data/sources.json'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    # Primary run: 08:15 BRT. GitHub may delay scheduled workflows, so use two fallbacks.
    - cron: '15 11 * * *'
    - cron: '15 12 * * *'
    - cron: '15 13 * * *'

concurrency:
  group: glermenrik-daily-engine
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      needs_refresh: ${{ steps.edition_check.outputs.needs_refresh }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether today's edition already exists
        id: edition_check
        run: |
          TODAY=$(TZ=America/Sao_Paulo date +%F)
          EDITION_DATE=$(python3 -c "import json; print(json.load(open('data/daily.json')).get('editionDate', ''))")
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$EDITION_DATE" = "$TODAY" ]; then
            echo "needs_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Today's edition ($TODAY) already exists; skipping duplicate refresh."
          else
            echo "needs_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Edition date is $EDITION_DATE; refreshing for $TODAY."
          fi

      - name: Fetch feeds
        if: steps.edition_check.outputs.needs_refresh == 'true'
        run: python3 scripts/fetch_feeds.py

      - name: Build editorial edition
        if: steps.edition_check.outputs.needs_refresh == 'true'
        run: python3 scripts/build_edition.py

      - name: Commit edition
        if: steps.edition_check.outputs.needs_refresh == 'true'
        run: |
          git config user.name 'glermenrik-daily-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/articles.json data/daily.json data/history
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'chore: refresh creative den edition'
          git pull --rebase origin main
          git push

  deploy:
    needs: ingest
    if: needs.ingest.outputs.needs_refresh == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
