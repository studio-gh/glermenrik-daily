name: Glermenrik Daily Engine
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/sources.json'
      - 'scripts/fetch_feeds.py'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '15 12 * * *'

concurrency:
  group: glermenrik-daily-engine
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python3 scripts/fetch_feeds.py
      - name: Commit edition
        run: |
          git config user.name 'glermenrik-daily-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/articles.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'chore: refresh daily edition'
          git pull --rebase origin main
          git push